  :root {
    --bg: #FBFAF7;
    --white: #FFFFFF;
    --ink: #141414;
    --muted: #8C8A86;
    --faint: #C2BFB9;
    --line: #E8E5DF;
    --soft: #F2F0EB;
    --tile: #EEECE7;
    --accent: #8A5A3B;
    --navy: #24345A;
    --red: #C2452D;
    --serif: "Instrument Serif", "Songti SC", "Noto Serif SC", "STSong", serif;
    --sans: "Inter", "Helvetica Neue", Helvetica, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --hand: "Gochi Hand", "Bradley Hand", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  /* a whisper of paper grain over everything */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 3000; opacity: .06; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* two voices only: big serif capitals, and this tiny bold uppercase label */
  .label, .logo, .cities button, .lang, .enter, .hint, .back, .maplink, .tags, .expand, .mapnote, footer, .gname, .lbclose {
    font-family: var(--sans); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; line-height: 1.2;
  }
  /* the handwritten number tile */
  .nt {
    display: inline-grid; place-items: center; flex: 0 0 auto;
    width: 28px; height: 28px; border-radius: 8px; background: var(--tile); color: var(--ink);
    font-family: var(--hand); font-size: 20px; line-height: 1; padding-top: 2px;
  }

  /* ---------- header ---------- */
  .nav {
    flex: 0 0 auto; position: relative; z-index: 20;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    padding: 22px 28px 14px;
  }
  .logo { justify-self: start; text-align: left; }
  .cities { display: flex; gap: 22px; }
  .cities button { color: var(--faint); transition: color .15s; }
  .cities button:hover, .cities button.on { color: var(--ink); }
  .lang { justify-self: end; color: var(--faint); }
  .lang b { color: var(--ink); font-weight: 600; }

  /* ---------- home: the globe ---------- */
  .home { flex: 1; position: relative; overflow: hidden; min-height: 0; touch-action: none; }
  .home[hidden] { display: none; }
  #globe { position: absolute; inset: 0; cursor: grab; }
  #globe.dragging { cursor: grabbing; }
  .gpins { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .gpin {
    position: absolute; display: flex; align-items: flex-end; gap: 4px;
    transform: translate(-9px, -100%); pointer-events: auto; transition: opacity .3s;
  }
  .gpin svg { width: 18px; height: 26px; display: block; flex: 0 0 auto; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .gpin .gl {
    display: flex; align-items: center; gap: 7px; margin-bottom: 16px;
    background: rgba(251,250,247,.94); padding: 3px 10px 3px 3px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: transform .2s;
  }
  .gpin:hover .gl { transform: translateY(-2px); }
  .gpin.hidden { opacity: 0; pointer-events: none; }
  .gpin.left { flex-direction: row-reverse; transform: translate(calc(-100% + 9px), -100%); }
  .gpin.left .gl { flex-direction: row-reverse; padding: 3px 3px 3px 10px; }

  .lens {
    position: absolute; left: 0; top: 0; z-index: 5;
    width: calc(var(--lr) * 2); height: calc(var(--lr) * 2); margin: calc(var(--lr) * -1) 0 0 calc(var(--lr) * -1);
    border-radius: 50%; opacity: 0; transform: scale(.9); pointer-events: none;
    transition: opacity .45s, transform .7s cubic-bezier(.2, .8, .2, 1);
  }
  .lens.on { opacity: 1; transform: none; pointer-events: auto; }
  .lens .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(251,250,247,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 24px 70px rgba(40,35,20,.22), inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .ring { position: absolute; inset: 0; animation: spin 160s linear infinite; }
  .lens:hover .ring { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thumb {

    box-shadow: 0 2px 6px rgba(0,0,0,.18);
    transform: rotate(var(--a)) translateY(calc(var(--rr) * -1)) scale(0);
    transition: transform .8s cubic-bezier(.2, .8, .2, 1) var(--d);
  }
  .lens.on .thumb { transform: rotate(var(--a)) translateY(calc(var(--rr) * -1)) scale(1); }
  .lens.on .thumb:hover { transform: rotate(var(--a)) translateY(calc(var(--rr) * -1)) scale(1.45); z-index: 2; transition-delay: 0s; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .lcenter {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: calc(var(--rr) * 1.45); text-align: center; display: flex; flex-direction: column; align-items: center;
  }
  .lname {
    font-family: var(--serif); font-weight: 400; text-transform: uppercase; letter-spacing: -.01em;
    font-size: calc(var(--lr) * .23); line-height: .88; margin: 12px 0 10px;
  }
  .enter { margin-top: 16px; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
  .enter:hover { color: var(--accent); border-color: var(--accent); }

  .legend { position: absolute; left: 28px; bottom: 24px; z-index: 6; display: flex; align-items: center; gap: 10px; }
  .legend button { display: flex; align-items: center; gap: 7px; color: var(--faint); transition: color .2s; }
  .legend button .nt { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--faint); transition: all .2s; }
  .legend button.on, .legend button:hover { color: var(--ink); }
  .legend button.on .nt { background: var(--tile); box-shadow: none; color: var(--ink); }
  .legend .dash { width: 24px; border-top: 2px dotted var(--red); opacity: .8; }
  .hint { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); color: var(--faint); z-index: 6; white-space: nowrap; }
  .tagline {
    position: absolute; right: 28px; bottom: 22px; z-index: 6; text-align: right;
    font-family: var(--serif); text-transform: uppercase; font-size: 22px; line-height: 1.05;
  }
  .tagline span { display: block; }
  .tagline span:last-child { padding-right: 84px; }

  /* ---------- city view ---------- */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr; }
  .app[hidden] { display: none; }
  .mapwrap { position: relative; min-height: 0; }
  #map, .leaflet-container {
    background-color: var(--soft);
    background-image: radial-gradient(rgba(20,20,20,.10) 1px, transparent 1.2px);
    background-size: 16px 16px;
  }
  #map { position: absolute; inset: 6px 0 28px 28px; overflow: hidden; border-radius: 4px; }
  .list { overflow-y: auto; padding: 6px 40px 45vh 44px; scroll-behavior: smooth; }
  .app.expanded { grid-template-columns: 1fr 0fr; }
  .app.expanded .list { display: none; }
  .app.expanded #map { right: 28px; }
  .expand { position: absolute; top: 20px; right: 14px; z-index: 500; background: var(--white); padding: 8px 12px; border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .app.expanded .expand { right: 42px; }
  .expand:hover { background: var(--ink); color: var(--white); }
  .mapnote {
    position: absolute; top: 20px; left: 42px; z-index: 500; max-width: calc(100% - 210px);
    background: var(--white); padding: 8px 12px; border-radius: 12px; color: var(--muted);
    text-transform: none; font-weight: 500; line-height: 1.45; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .back { color: var(--faint); margin-bottom: 26px; display: inline-block; }
  .back:hover { color: var(--ink); }
  .ctitle {
    font-family: var(--serif); font-weight: 400; text-transform: uppercase;
    font-size: clamp(56px, 6.2vw, 100px); line-height: .84; letter-spacing: -.015em; margin: 12px 0 14px;
  }
  .intro .hd { display: flex; align-items: center; gap: 10px; }
  .gallery { display: flex; align-items: flex-start; gap: 12px; overflow-x: auto; margin: 32px -40px 0 0; padding: 0 40px 10px 0; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery button { flex: 0 0 auto; height: 220px; overflow: hidden; cursor: zoom-in; border-radius: 2px; }
  .gallery button:nth-child(3n+2) { height: 160px; margin-top: 44px; }
  .gallery button:nth-child(3n) { height: 190px; margin-top: 14px; }
  .gallery img { height: 100%; width: auto; display: block; transition: transform .6s; }
  .gallery button:hover img { transform: scale(1.04); }
  .intro .row { display: flex; justify-content: space-between; margin-top: 36px; color: var(--muted); }

  .card { padding: 26px 0 30px; border-top: 1px solid var(--line); cursor: pointer; }
  .card:first-of-type { margin-top: 12px; }
  .photo { width: 78%; aspect-ratio: 3 / 2; overflow: hidden; margin-bottom: 18px; background: var(--soft); border-radius: 2px; }
  .card:nth-of-type(even) .photo { margin-left: auto; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s; }
  .card:hover .photo img { transform: scale(1.03); }
  .top { display: flex; align-items: center; gap: 14px; }
  .card .nt { transition: background .2s, color .2s; }
  .card.active .nt { background: var(--navy); color: var(--white); }
  .name { font-family: var(--serif); font-weight: 400; font-size: 34px; text-transform: uppercase; letter-spacing: -.005em; margin: 0; line-height: .95; }
  .area { color: var(--muted); font-size: 13px; margin: 10px 0 0 42px; }
  .note { margin: 12px 0 0 42px; font-size: 15px; max-width: 420px; }
  .tags { margin: 12px 0 0 42px; color: var(--muted); }
  .tags span + span::before { content: " / "; }
  .addr { margin: 10px 0 0 42px; font-size: 12.5px; color: var(--muted); }
  .maplink { display: inline-block; margin: 12px 0 0 42px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
  .maplink:hover { color: var(--accent); border-color: var(--accent); }
  footer { color: var(--faint); margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); }

  /* ---------- map pins, labels, popups ---------- */
  .npin .nt { width: 30px; height: 30px; background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.22); transition: transform .2s; }
  .npin:hover .nt { transform: translateY(-2px); }
  .npin.is-active .nt { background: var(--navy); color: var(--white); transform: scale(1.15); }
  .leaflet-tooltip.lbl {
    background: var(--white); border: 0; border-radius: 8px; color: var(--ink);

  }
  .leaflet-tooltip.lbl::before { display: none; }
  .leaflet-tooltip.lbl b { font-family: var(--serif); font-weight: 400; font-size: 17px; text-transform: uppercase; display: block; line-height: 1; }
  .leaflet-tooltip.lbl small { color: var(--muted); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  .leaflet-tooltip.lbl.is-active { background: var(--navy); color: var(--white); }
  .leaflet-tooltip.lbl.is-active small { color: #C9D0E0; }
  .labels-off .leaflet-tooltip.lbl { display: none; }
  .leaflet-popup-content-wrapper { border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0; font-family: var(--sans); color: var(--ink); width: 220px !important; }
  .pop img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .pop .pt { padding: 10px 14px 12px; }
  .pop b { font-family: var(--serif); font-weight: 400; font-size: 22px; text-transform: uppercase; display: block; line-height: 1; }
  .pop .pa { color: var(--muted); font-size: 12px; }
  .pop p { margin: 6px 0; font-size: 13px; }
  .pop a { color: var(--ink); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .leaflet-control-attribution { font-size: 9.5px; }

  /* ---------- lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 2000; background: rgba(251,250,247,.97);
    display: grid; grid-template-columns: 64px 1fr 64px; grid-template-rows: 1fr auto; align-items: center; padding: 28px 20px 18px;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { grid-column: 2; grid-row: 1; justify-self: center; max-width: 100%; max-height: calc(100vh - 110px); transition: opacity .18s; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
  .lightbox img.fade { opacity: 0; }
  .lbx { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--ink); transition: background .2s; justify-self: center; }
  .lbx:hover { background: var(--tile); }
  .lbbar { grid-column: 1 / -1; grid-row: 2; display: flex; justify-content: space-between; align-items: center; padding: 14px 8px 0; }
  .lbcount { font-family: var(--hand); font-size: 24px; line-height: 1; }
  .lbclose { color: var(--muted); }
  .lbclose:hover { color: var(--ink); }

  /* ---------- mobile ---------- */
  @media (max-width: 760px) {
    .nav { grid-template-columns: 1fr auto; row-gap: 14px; padding: 16px 16px 10px; }
    .cities { grid-column: 1 / -1; grid-row: 2; gap: 18px; }
    .legend { left: 50%; transform: translateX(-50%); bottom: 18px; gap: 8px; }
    .legend .dash { width: 14px; }
    .legend button:not(.on) { font-size: 0; gap: 0; }
    .hint, .tagline { display: none; }
    .app { grid-template-columns: 1fr; grid-template-rows: 36vh 1fr; }
    .app.expanded { grid-template-columns: 1fr; grid-template-rows: 1fr 0; }
    #map, .app.expanded #map { inset: 4px 16px 0 16px; }
    .expand, .app.expanded .expand { top: 14px; right: 26px; }
    .mapnote { top: 14px; left: 26px; max-width: calc(100% - 150px); }
    .list { padding: 20px 16px 50vh; }
    .gallery { margin-right: -16px; padding-right: 16px; }
    .gallery button { height: 170px; }
    .gallery button:nth-child(3n+2) { height: 124px; margin-top: 34px; }
    .gallery button:nth-child(3n) { height: 148px; margin-top: 10px; }
    .photo { width: 88%; }
    .name { font-size: 28px; }
    .lightbox { grid-template-columns: 1fr; padding: 16px 12px 12px; }
    .lbx { display: none; }
    .lightbox img { grid-column: 1; }
  }

  const b = document.createElement("button");
  b.className = "gpin" + (k === "Michigan" ? " left" : "");
  b.innerHTML = `${PIN_SVG}<span class="gl"><span class="nt">${i + 1}</span><span class="gname">${esc(CITY[k].name)}</span></span>`;
  b.addEventListener("click", e => { e.stopPropagation(); select(k); });
  $("gpins").appendChild(b);
  pinEls[k] = b;
});
function placePins() {
  const center = [-rot[0], -rot[1]];
  CITY_ORDER.forEach(k => {
    const p = proj(CITY[k].geo);
    const visible = d3.geoDistance(CITY[k].geo, center) < Math.PI / 2 - 0.06;
    const el = pinEls[k];
    el.style.left = p[0] + "px"; el.style.top = p[1] + "px";
    el.classList.toggle("hidden", !visible || (lensOn && k === state.homeCity));
  });
}

function targetRot(k) { const [lon, lat] = CITY[k].geo; return [-lon, -(lat - G.tilt), 0]; }
const wrap = a => ((a + 540) % 360 + 360) % 360 - 180;
function rotateTo(r1, ms, done) {
  cancelAnimationFrame(anim);
  const r0 = rot.slice(), dl = wrap(r1[0] - r0[0]), t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = d3.easeCubicInOut(t);
    rot = [r0[0] + dl * e, r0[1] + (r1[1] - r0[1]) * e, 0];
    draw();
    if (t < 1) anim = requestAnimationFrame(step);
    else { rot[0] = wrap(rot[0]); if (done) done(); }
  };
  anim = requestAnimationFrame(step);
}
let busyUntil = 0;
function select(k, ms) {
  state.homeCity = k;
  busyUntil = performance.now() + 900;
  renderNav(); renderLegend(); hideLens();
  rotateTo(targetRot(k), ms || 1500, showLens);
}

function showLens() {
  const k = state.homeCity, c = CITY[k], t = T[state.lang];
  const lr = G.mobile ? Math.min(G.W * 0.44, 172) : Math.min(G.H * 0.31, 248);
  const ts = G.mobile ? 34 : 48, rr = lr - ts * 0.6 - 12;
  const ids = cityPhotos(k), n = Math.max(ids.length, G.mobile ? 12 : 16);
  const p = proj(c.geo), lens = $("lens");
  lens.style.left = p[0] + "px"; lens.style.top = p[1] + "px";
  lens.style.setProperty("--lr", lr + "px");
  lens.style.setProperty("--ts", ts + "px");
  lens.style.setProperty("--rr", rr + "px");
  let thumbs = "";
  for (let i = 0; i < n; i++) {
    const id = ids[i % ids.length];
    thumbs += `<button class="thumb" data-photo="${id}" data-set="${k}" style="--a:${(360 * i / n).toFixed(2)}deg;--d:${i * 32}ms"><img src="${PHOTOS[id]}" alt=""></button>`;
  }
  lens.innerHTML = `
    <div class="disc"></div>
    <div class="ring">${ids.length ? thumbs : ""}</div>
    <div class="lcenter">
      <span class="nt">${CITY_ORDER.indexOf(k) + 1}</span>
      <h1 class="lname">${esc(c.name)}</h1>
      <div class="label">${esc(c.sub)}</div>
      <button class="enter" id="enterBtn">${t.enter(cafesIn(k).length)}</button>
    </div>`;
  $("enterBtn").addEventListener("click", () => enterCity(k));
  lensOn = true;
  placePins();
  requestAnimationFrame(() => requestAnimationFrame(() => lens.classList.add("on")));
}
function hideLens() { $("lens").classList.remove("on"); lensOn = false; placePins(); }

/* drag to spin the globe */
let drag = null;
cv.addEventListener("pointerdown", e => {
  cancelAnimationFrame(anim);
  drag = { x: e.clientX, y: e.clientY, r: rot.slice(), moved: false };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; hideLens(); cv.classList.add("dragging"); }
  if (!drag.moved) return;
  const k = 57.3 / G.R;
  rot = [drag.r[0] + dx * k, Math.max(-80, Math.min(80, drag.r[1] - dy * k)), 0];
  draw();
});
const endDrag = () => {
  if (!drag) return;
  const moved = drag.moved;
  drag = null; cv.classList.remove("dragging");
  if (!moved && !lensOn) select(state.homeCity, 1100);
};
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

/* wheel and arrow keys walk the route */
function go(dir) {
  if (performance.now() < busyUntil) return;
  const i = (CITY_ORDER.indexOf(state.homeCity) + dir + 3) % 3;
  select(CITY_ORDER[i]);
}
let wheelAcc = 0;
homeEl.addEventListener("wheel", e => {
  e.preventDefault();
  wheelAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (Math.abs(wheelAcc) > 60) { go(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; }
}, { passive: false });
document.addEventListener("keydown", e => {
  if (!$("lightbox").hidden) {
    if (e.key === "ArrowRight") stepLB(1);
    if (e.key === "ArrowLeft") stepLB(-1);
    if (e.key === "Escape") closeLB();
    return;
  }
  if (state.view !== "home") return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") go(1);
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(-1);
  if (e.key === "Enter") enterCity(state.homeCity);
});

function renderLegend() {
  $("legend").innerHTML = CITY_ORDER.map((k, i) =>
    `${i ? '<span class="dash"></span>' : ""}<button class="label ${k === state.homeCity ? "on" : ""}" data-leg="${k}"><span class="nt">${i + 1}</span>${esc(CITY[k].name)}</button>`).join("");
}
$("legend").addEventListener("click", e => {
  const b = e.target.closest("[data-leg]");
  if (b) select(b.dataset.leg);
});
window.addEventListener("resize", () => {
  if (state.view !== "home") return;
  sizes();
  if (lensOn) { rot = targetRot(state.homeCity); draw(); showLens(); } else draw();
});

/* ============================================================
   LIGHTBOX · tap a photo, then swipe or use the arrows
   ============================================================ */
const LB = { ids: [], i: 0 };
function openLB(ids, i) { LB.ids = ids; LB.i = i; $("lightbox").hidden = false; showLB(true); }
function closeLB() { $("lightbox").hidden = true; }
function showLB(now) {
  const img = $("lbImg");
  const swap = () => { img.src = PHOTOS[LB.ids[LB.i]]; img.classList.remove("fade"); };
  if (now) swap(); else { img.classList.add("fade"); setTimeout(swap, 160); }
  $("lbCount").textContent = `${LB.i + 1} / ${LB.ids.length}`;
}
function stepLB(d) { LB.i = (LB.i + d + LB.ids.length) % LB.ids.length; showLB(false); }
$("lbPrev").addEventListener("click", e => { e.stopPropagation(); stepLB(-1); });
$("lbNext").addEventListener("click", e => { e.stopPropagation(); stepLB(1); });
$("lbClose").addEventListener("click", closeLB);
$("lightbox").addEventListener("click", e => { if (e.target === $("lightbox")) closeLB(); });
let lbX = null;
$("lightbox").addEventListener("touchstart", e => { lbX = e.touches[0].clientX; }, { passive: true });
$("lightbox").addEventListener("touchend", e => {
  if (lbX == null) return;
  const dx = e.changedTouches[0].clientX - lbX;
  if (Math.abs(dx) > 40) stepLB(dx < 0 ? 1 : -1);
  lbX = null;
}, { passive: true });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-photo]");
  if (!b) return;
  const ids = cityPhotos(b.dataset.set);
  openLB(ids, Math.max(0, ids.indexOf(b.dataset.photo)));
});

/* ============================================================
   CITY VIEW · numbered pins on a street map, joined by a navy route
   ============================================================ */
const LABEL_ZOOM = 15;
const listEl = $("list"), appEl = $("app"), mapEl = $("map");
let map = null, layer = null, markers = {}, tilesFailed = false;

function ensureMap() {
  if (map) return;
  map = L.map("map", { zoomControl: false });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).on("tileerror", () => { if (!tilesFailed) { tilesFailed = true; updateNote(); } }).addTo(map);
  layer = L.layerGroup().addTo(map);
  map.on("zoomend", updateLabels);
}
const npin = (n, active) => L.divIcon({
  className: "npin" + (active ? " is-active" : ""), html: `<span class="nt">${n}</span>`,
  iconSize: [30, 30], iconAnchor: [15, 15]
});
function updateLabels() { mapEl.classList.toggle("labels-off", map.getZoom() < LABEL_ZOOM); }
function updateNote() {
  const t = T[state.lang], lines = [];
  if (cafesIn(state.city).some(c => c.lat == null)) lines.push(t.noPin);
  if (tilesFailed) lines.push(t.noTiles);
  $("mapnote").hidden = !lines.length;
  $("mapnote").innerHTML = lines.map(esc).join("<br>");
}

function renderMarkers() {
  layer.clearLayers();
  markers = {};
  const cfg = CITY[state.city];
  map.setView(cfg.center, cfg.zoom, { animate: false });
  const cafes = cafesIn(state.city);
  const pts = cafes.filter(c => c.lat != null).map(c => [c.lat, c.lng]);
  if (pts.length > 1) {
    L.polyline(pts, { color: "#FFFFFF", weight: 9, opacity: .9, lineJoin: "round", lineCap: "round", interactive: false }).addTo(layer);
    L.polyline(pts, { color: "#24345A", weight: 5, opacity: .92, lineJoin: "round", lineCap: "round", interactive: false }).addTo(layer);
  }
  cafes.forEach((c, i) => {
    if (c.lat == null || c.lng == null) return;
    const n = i + 1, tags = tagText(c), ph = photoOf(c);
    const m = L.marker([c.lat, c.lng], { icon: npin(n, false) });
    m.bindTooltip(`<b>${esc(c.name)}</b>${tags.length ? `<small>${esc(tags.join(" / "))}</small>` : ""}`,
      { permanent: true, direction: "right", offset: [18, 0], className: "lbl", interactive: false });
    m.bindPopup(`<div class="pop">${ph ? `<img src="${ph}" alt="">` : ""}<div class="pt"><b>${esc(c.name)}</b><span class="pa">${esc(c.area)}</span>
      ${noteOf(c) ? `<p>${esc(noteOf(c))}</p>` : ""}<a href="${mapUrl(c)}" target="_blank" rel="noopener">${T[state.lang].map}</a></div></div>`,
      { closeButton: false, offset: [0, -14] });
    m.on("click", () => { state.userScrolled = true; setActive(c.id, false); scrollToCard(c.id); });
    m.addTo(layer);
    markers[c.id] = { m, n };
  });
  updateNote();
  updateLabels();
}

function renderList() {
  const t = T[state.lang], k = state.city, c = CITY[k];
  const cafes = cafesIn(k);
  listEl.innerHTML = `
    <div class="intro">
      <button class="back" id="backBtn">${t.back}</button>
      <div class="hd"><span class="nt">${CITY_ORDER.indexOf(k) + 1}</span></div>
      <h1 class="ctitle">${esc(c.name)}</h1>
      <div class="label">${esc(c.sub)}</div>
      <div class="gallery">${cityPhotos(k).map(id =>
        `<button data-photo="${id}" data-set="${k}" aria-label="photo"><img src="${PHOTOS[id]}" alt="" loading="lazy"></button>`).join("")}</div>
      <div class="row"><span>${t.cafes}</span><span>${t.count(cafes.length)}</span></div>
    </div>
    ${cafes.map((x, i) => {
      const tags = tagText(x), note = noteOf(x), ph = photoOf(x);
      return `
      <article class="card" data-id="${x.id}">
        ${ph ? `<div class="photo"><img src="${ph}" alt="${esc(x.name)}" loading="lazy"></div>` : ""}
        <div class="top"><span class="nt">${i + 1}</span><h2 class="name">${esc(x.name)}</h2></div>
        ${x.area ? `<div class="area">${esc(x.area)}</div>` : ""}
        ${note ? `<p class="note">${esc(note)}</p>` : ""}
        ${tags.length ? `<div class="tags">${tags.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : ""}
        <div class="addr">${esc(x.address || "")}</div>
        <a class="maplink" href="${mapUrl(x)}" target="_blank" rel="noopener">${t.map}</a>
      </article>`;
    }).join("")}
    <footer>${t.footer}</footer>`;
  $("backBtn").addEventListener("click", goHome);
  listEl.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      const id = card.dataset.id;
      setActive(id, true);
      const mk = markers[id];
      if (mk) setTimeout(() => mk.m.openPopup(), 950);
    });
  });
  observeCards();
}

function scrollToCard(id) {
  const card = listEl.querySelector(`.card[data-id="${id}"]`);
  if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
}
function setActive(id, fly) {
  const prev = markers[state.active];
  if (prev && state.active !== id) {
    prev.m.setIcon(npin(prev.n, false)); prev.m.setZIndexOffset(0);
    const el = prev.m.getTooltip() && prev.m.getTooltip().getElement();
    if (el) el.classList.remove("is-active");
  }
  state.active = id;
  listEl.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c.dataset.id === id));
  const mk = markers[id];
  if (!mk) return;
  mk.m.setIcon(npin(mk.n, true)); mk.m.setZIndexOffset(1000);
  const el = mk.m.getTooltip() && mk.m.getTooltip().getElement();
  if (el) el.classList.add("is-active");
  if (fly) map.flyTo(mk.m.getLatLng(), 16, { duration: 0.9 });
}

let io;
function observeCards() {
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    if (!state.userScrolled) return;
    const hit = entries.find(e => e.isIntersecting);
    if (hit && hit.target.dataset.id !== state.active) setActive(hit.target.dataset.id, true);
  }, { root: listEl, rootMargin: "-35% 0px -60% 0px", threshold: 0 });
  listEl.querySelectorAll(".card").forEach(c => io.observe(c));
}
["wheel", "touchmove", "keydown"].forEach(ev =>
  listEl.addEventListener(ev, () => { state.userScrolled = true; }, { passive: true }));

function renderCity() {
  state.active = null;
  state.userScrolled = false;
  listEl.scrollTop = 0;
  ensureMap();
  map.invalidateSize();
  renderMarkers();
  renderList();
  $("expandBtn").textContent = state.expanded ? T[state.lang].collapse : T[state.lang].expand;
}

/* ============================================================
   moving between the globe and a city
   ============================================================ */
function renderNav() {
  const current = state.view === "home" ? state.homeCity : state.city;
  $("cities").innerHTML = CITY_ORDER.map(k =>
    `<button class="${k === current ? "on" : ""}" data-city="${k}">${esc(CITY[k].name)}</button>`).join("");
  $("langBtn").innerHTML = state.lang === "zh" ? "<b>中</b> / EN" : "中 / <b>EN</b>";
  $("hint").textContent = T[state.lang].hint;
  document.documentElement.lang = state.lang;
}
function enterCity(k) {
  cancelAnimationFrame(anim);
  state.view = "city";
  state.city = k;
  homeEl.hidden = true;
  appEl.hidden = false;
  renderNav();
  requestAnimationFrame(renderCity);
}
function goHome() {
  state.view = "home";
  state.homeCity = state.city;
  appEl.hidden = true;
  homeEl.hidden = false;
  renderNav(); renderLegend();
  sizes();
  rot = targetRot(state.homeCity);
  draw();
  showLens();
}

$("cities").addEventListener("click", e => {
  const b = e.target.closest("[data-city]");
  if (!b) return;
  const k = b.dataset.city;
  if (state.view === "home") { if (k !== state.homeCity || !lensOn) select(k); }
  else if (k !== state.city) { state.city = k; renderNav(); renderCity(); }
});
$("homeBtn").addEventListener("click", () => { if (state.view !== "home") goHome(); });
$("langBtn").addEventListener("click", () => {
  state.lang = state.lang === "zh" ? "en" : "zh";
  renderNav();
  if (state.view === "home") { if (lensOn) showLens(); }
  else renderCity();
});
$("expandBtn").addEventListener("click", () => {
  state.expanded = !state.expanded;
  appEl.classList.toggle("expanded", state.expanded);
  $("expandBtn").textContent = state.expanded ? T[state.lang].collapse : T[state.lang].expand;
  setTimeout(() => map.invalidateSize(), 320);
});

/* first load: the globe spins in and settles on the first city */
renderNav();
renderLegend();
sizes();
rot = [targetRot("Hangzhou")[0] + 95, -12, 0];
draw();
setTimeout(() => select("Hangzhou", 2300), 250);
</script>
</body>
</html>
